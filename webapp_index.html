<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atelier — 方程可视化</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+SC:wght@300;400;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/webapp_styles.css" />
</head>
<body>
  <!-- 氛围层 -->
  <div class="noise" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <header class="atelier-header">
    <button id="navToggleBtn" class="menu-trigger" type="button" aria-label="切换侧边栏">
      <span></span>
      <span></span>
    </button>
    <div class="brand">
      <div class="brand-name">Atelier</div>
      <div class="brand-line"></div>
      <div class="brand-sub">方程可视化工作室</div>
    </div>
    <div class="header-actions">
      <button id="resetViewBtnTop" class="text-link" type="button">重置视角</button>
    </div>
  </header>

  <div class="layout">
    <aside class="palette">
      <div class="palette-inner">
        <section class="palette-section composition">
          <div class="section-eyebrow">
            <span class="eyebrow-index">01</span>
            <span class="eyebrow-line"></span>
          </div>
          <h2 class="section-title">Composition</h2>
          <p class="section-desc">输入方程，构建你的几何作品</p>

          <div class="equation-composer">
            <label class="field-label">Equation</label>
            <div class="input-bezel">
              <input id="eqInput" type="text" placeholder="z = sqrt(4 - x^2 - y^2)" autocomplete="off" />
            </div>
            <div class="composer-actions">
              <button id="addBtn" class="pill-btn" type="button">Add</button>
              <button id="drawBtn" class="pill-btn primary" type="button">Render</button>
              <button id="clearBtn" class="pill-btn ghost" type="button">Clear</button>
            </div>
          </div>

          <div class="quality-field">
            <label for="qualitySel">Resolution</label>
            <div class="select-bezel">
              <select id="qualitySel">
                <option value="1" selected>Standard · real-time</option>
                <option value="2">High definition</option>
                <option value="3">Ultra fine</option>
              </select>
            </div>
          </div>

          <div id="status" class="status-strip">
            <span class="status-pip"></span>
            <span class="status-text">Ready</span>
          </div>
        </section>

        <section id="inputPad" class="palette-section keyboard">
          <div class="section-eyebrow">
            <span class="eyebrow-index">02</span>
            <span class="eyebrow-line"></span>
            <button id="closeInputPadBtn" class="collapse-btn" type="button">Collapse</button>
          </div>
          <h2 class="section-title">Notation</h2>
          <div class="math-grid">
            <button class="math-key" data-token="x">x</button>
            <button class="math-key" data-token="y">y</button>
            <button class="math-key" data-token="z">z</button>
            <button class="math-key" data-token="pi">π</button>
            <button class="math-key" data-token="e">e</button>
            <button class="math-key" data-token="sqrt()">√</button>

            <button class="math-key" data-token="sin()">sin</button>
            <button class="math-key" data-token="cos()">cos</button>
            <button class="math-key" data-token="tan()">tan</button>
            <button class="math-key" data-token="+">+</button>
            <button class="math-key" data-token="-">−</button>
            <button class="math-key" data-token="^">^</button>

            <button class="math-key" data-token="7">7</button>
            <button class="math-key" data-token="8">8</button>
            <button class="math-key" data-token="9">9</button>
            <button class="math-key" data-token="*">×</button>
            <button class="math-key" data-token="/">÷</button>
            <button class="math-key" data-token="=">=</button>

            <button class="math-key" data-token="4">4</button>
            <button class="math-key" data-token="5">5</button>
            <button class="math-key" data-token="6">6</button>
            <button class="math-key" data-token="(">(</button>
            <button class="math-key" data-token=")">)</button>
            <button class="math-key" data-token=",">,</button>

            <button class="math-key" data-token="1">1</button>
            <button class="math-key" data-token="2">2</button>
            <button class="math-key" data-token="3">3</button>
            <button class="math-key" data-token="ln()">ln</button>
            <button class="math-key" data-token="log()">log</button>
            <button class="math-key" data-token="abs()">abs</button>

            <button class="math-key" data-token="0">0</button>
            <button class="math-key" data-token=".">.</button>
            <button class="math-key action" data-action="left">←</button>
            <button class="math-key action" data-action="right">→</button>
            <button class="math-key action" data-action="backspace">⌫</button>
            <button class="math-key action" data-action="clear">AC</button>
          </div>
        </section>

        <section class="palette-section gallery">
          <div class="section-eyebrow">
            <span class="eyebrow-index">03</span>
            <span class="eyebrow-line"></span>
            <span id="eqCount" class="count-chip">0</span>
          </div>
          <h2 class="section-title">Gallery</h2>
          <ul id="eqList" class="object-list"></ul>
          <div id="emptyState" class="empty-plate">
            <span class="empty-number">00</span>
            <p>No equations yet</p>
          </div>
        </section>

        <section class="palette-section parameters">
          <div class="section-eyebrow">
            <span class="eyebrow-index">04</span>
            <span class="eyebrow-line"></span>
          </div>
          <h2 class="section-title">Parameters</h2>
          <div id="paramList" class="parameter-list"></div>
        </section>

        <section class="palette-section view-controls">
          <div class="section-eyebrow">
            <span class="eyebrow-index">05</span>
            <span class="eyebrow-line"></span>
          </div>
          <h2 class="section-title">View</h2>
          <div class="toggle-list">
            <label class="toggle-item">
              <span>Reference grid</span>
              <input id="toggleGrid" type="checkbox" checked />
              <span class="toggle-switch"></span>
            </label>
            <label class="toggle-item">
              <span>Ground plane</span>
              <input id="togglePlane" type="checkbox" checked />
              <span class="toggle-switch"></span>
            </label>
            <label class="toggle-item">
              <span>Legend overlay</span>
              <input id="toggleLegend" type="checkbox" checked />
              <span class="toggle-switch"></span>
            </label>
          </div>
        </section>
      </div>
    </aside>

    <main class="stage">
      <div id="viewer"></div>

      <div class="stage-frame" aria-hidden="true">
        <div class="frame-corner tl"></div>
        <div class="frame-corner tr"></div>
        <div class="frame-corner bl"></div>
        <div class="frame-corner br"></div>
      </div>

      <div id="miniAxis" class="orientation-plate">
        <span class="plate-label">XYZ</span>
      </div>

      <div id="legend" class="equation-legend">
        <div class="legend-title">
          <span class="legend-index">Eq</span>
          <span>Equations</span>
        </div>
      </div>

      <div class="stage-tools">
        <button id="zoomInBtn" type="button" aria-label="放大">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
        <button id="zoomOutBtn" type="button" aria-label="缩小">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M5 12h14" />
          </svg>
        </button>
        <button id="resetViewBtn" type="button" aria-label="重置视角">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </button>
      </div>
    </main>
  </div>

  <script type="module" src="/webapp_app.js"></script>
</body>
</html>
